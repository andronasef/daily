name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured or empty"
            exit 1
          fi
          python3 - << 'EOF'
          import os, base64, subprocess

          def clean_secret(val):
              if not val:
                  return ''
              return val.strip('\ufeff \r\n\t')

          raw_keystore = os.environ.get('KEYSTORE_BASE64', '')
          valid_chars = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          cleaned_keystore = ''.join(c for c in raw_keystore if c in valid_chars)
          decoded = base64.b64decode(cleaned_keystore)
          with open('android/app/release.jks', 'wb') as f:
              f.write(decoded)

          password = clean_secret(os.environ.get('KEYSTORE_PASSWORD', ''))
          alias = clean_secret(os.environ.get('KEY_ALIAS', ''))

          with open('android/key.properties', 'w', encoding='utf-8') as f:
              f.write('storeFile=release.jks\n')
              f.write(f'storePassword={password}\n')
              f.write(f'keyAlias={alias}\n')
              f.write(f'keyPassword={password}\n')

          # Verify with keytool in Python
          res = subprocess.run([
              'keytool', '-list',
              '-keystore', 'android/app/release.jks',
              '-storepass', password,
              '-alias', alias
          ], capture_output=True, text=True)
          if res.returncode == 0:
              print(f"Keystore and alias '{alias}' verified successfully!")
          else:
              print(f"Notice: keytool check output: {res.stderr.strip()}")
          EOF
          if [ ! -s android/app/release.jks ]; then
            echo "::error::android/app/release.jks is empty after decoding"
            exit 1
          fi
          ls -lh android/app/release.jks

      # versionName = tag, versionCode = run number (must grow for OTA installs)
      - run: flutter pub get
      - run: flutter build apk --release --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "daily-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "daily-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --generate-notes
